# Config cho tmux server chạy sub-agent (socket -L piagents).
# Tách hẳn khỏi ~/.tmux.conf: không tpm, không continuum/resurrect, nên spawn
# sub-agent không kích hoạt restore session cũ và không bị snapshot 15 phút/lần.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Peek đọc scrollback qua capture-pane -S; 2000 dòng mặc định là quá ít.
set -g history-limit 50000

# Kitty graphics khi attach vào pane sub-agent.
set -g allow-passthrough on

# Shift+Enter / Alt+Enter đúng khi bạn attach vào và gõ trực tiếp.
set -g extended-keys on
set -g extended-keys-format csi-u

set -sg escape-time 10
set -g mouse on
set -g status off
